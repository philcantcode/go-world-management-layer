# Strict policy example accepted by the policy compiler.
apiVersion: world.philcantcode.dev/v1alpha1
kind: ResearchSessionPolicy
metadata:
  name: mixed-vr-visibility-first
  revision: 3

spec:
  lease:
    ttl: 2h
    priority: 50
    preemptible: true
    quiesceDeadline: 30s

  agentWorkspace:
    runtime:
      driver: docker
      image: registry.example/vr-agent@sha256:1111111111111111111111111111111111111111111111111111111111111111
      isolationProfile: agent-standard
      rootFilesystem: readOnly
      user: "10000:10000"
      capabilities:
        drop: [ALL]
        add: []
      noNewPrivileges: true
      seccompProfile: vr-agent-v1
    network:
      mode: restricted-egress
      allowDNS: true
      allowedCIDRs: []
      allowedDomains: []
      denyPrivateRanges: true
      targetAccess: scoped-gateway-and-declared-endpoints
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
        workspace: 20Gi
      limits:
        cpu: "4"
        memory: 8Gi
        swap: 0B
        pids: 2048
        workspace: 40Gi

  workspace:
    mode: overlayfs
    inputView:
      source: frozen-artifact-selection
      layout: by-evidence-path
      cacheScope: campaign
      construction: require-reflink
      reuseExactView: true
      verifyBeforeMount: true
      verifyAfterRun: true
      viewRetention: 24h
    cache:
      maxBytes: 500Gi
      highWaterPercent: 85
      lowWaterPercent: 70
      verifyOnPopulate: true
      reverify: on-uncertain-integrity
    export:
      declaration: agent-or-host
      regularFilesOnly: true
      maxFiles: 10000
      maxBytes: 20Gi
      retainFullChangeManifest: true

  targets:
    maxConcurrent: 2
    materialTransfer:
      source: declared-artifact-occurrences
      agentWorkspacePush: allowed-beneath-workspace-recorded
      maxTransferBytesPerRun: 4Gi
      verifyBeforeRun: true
    templates:
      - name: linux-binary-visible
        kind: linux-container
        runtime:
          driver: docker
          runtime: runc
          image: registry.example/linux-target@sha256:2222222222222222222222222222222222222222222222222222222222222222
          isolationProfile: observable-container
          baseImage: readOnly
          user: "20000:20000"
          capabilities:
            drop: [ALL]
            add: []
          noNewPrivileges: true
          seccompProfile: observed-target-v1
        material:
          mountPoint: /target/input
          writableState: private-overlay
        interaction:
          commandAuthority: arbitrary-inside-assigned-target
          execTransport: direct-argv-and-explicit-shell
          fileTransfer: push-pull-target-relative
          networkEndpoints: policy-declared
          deniedInfrastructureAuthority:
            - host-exec
            - docker-api
            - host-mounts
            - other-targets
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
            swap: 0B
            pids: 1024
            writableState: 10Gi
        reset:
          afterEveryRun: true
          mode: recreate-new-target-generation

      - name: android-apk-visible
        kind: android-virtual-device
        runtime:
          driver: android-emulator
          systemImageDigest: sha256:3333333333333333333333333333333333333333333333333333333333333333
          isolationProfile: instrumented-android
          baselineState: clean-boot
          requireHardwareAcceleration: true
          headless: true
          rooted: true
          debuggable: true
          guestMemory: 2Gi
          bootTimeout: 3m
        material:
          writableState: guest-data-partition
        interaction:
          commandAuthority: arbitrary-inside-assigned-device
          adb: scoped-gateway
          deviceScopedADBServices: arbitrary
          fileTransfer: adb-sync-and-scoped-stream
          deniedInfrastructureAuthority:
            - host-adb-server-control
            - other-serials
            - raw-usb
            - host-exec
        resources:
          limits:
            cpu: "4"
            memory: 6Gi
            writableState: 1Gi
        reset:
          afterEveryRun: true
          mode: baseline-new-target-generation

  resources:
    aggregateLimits:
      cpu: "12"
      memory: 20Gi
      captureBytes: 10Gi

  observation:
    priority: visibility-first
    requiredCoverage:
      linux-container:
        - process-tree
        - syscall-results
        - file-io-metadata
        - filesystem-change-manifest
        - network-flows
        - packet-ring
      android-virtual-device:
        - package-process-activity-lifecycle
        - android-logcat
        - android-perfetto-ring
        - app-api-intents
        - network-flows
        - packet-ring
        - filesystem-change-manifest
    profiles:
      default: metadata
      metadata:
        capturePayloads: false
        fileEvents: [open, read, write, rename, unlink]
        syscallArguments: selected-safe
      deep:
        maxDuration: 10m
        maxBytes: 4Gi
        signalFamilies: [process, file, network, resource-metrics]
      payload:
        enabled: authorized-on-demand
        requireProcessOrPathFilter: true
        maxDuration: 5m
        maxBytes: 1Gi
        sensitivity: restricted
        signalFamilies: [process, file, network]
    baseline:
      - world-lifecycle
      - docker-events
      - cgroup-metrics
      - host-pressure
      - input-view-cache
      - agent-process-lifecycle
      - target-process-lifecycle
      - target-syscall-metadata
      - target-file-io-metadata
      - target-filesystem-changes
      - target-network-flows
      - target-packet-ring
      - android-runtime-metrics
      - android-process-metrics
      - android-package-activity-lifecycle
      - android-app-api-intents
      - android-logcat
      - android-perfetto-ring
      - collector-health
    collectors:
      linuxMetadata:
        adapter: phase-0-selected-tracee-or-inspektor-gadget
        placement: host
        failRunOnCoverageLoss: true
      androidSystem:
        adapters: [perfetto, logcat, dumpsys]
        placement: guest
        failRunOnCoverageLoss: true
      androidAppHooks:
        adapter: frida
        placement: injected-app
        coverage: attached-processes
      packetCapture:
        adapter: dumpcap
        placement: host-network-namespace
        ringBytes: 2Gi
      protocolSummary:
        adapter: zeek
        mode: during-or-after-run
      mobileAnalysis:
        adapter: mobsf
        mode: external-api
    metrics:
      normalInterval: 2s
      incidentInterval: 250ms
      staleAfter: 6s
      rateWindows: [10s, 1m, 5m]
      dimensions:
        - host
        - lease
        - agent-workspace
        - target
        - target-run
        - observer
        - android-runtime
        - android-device
        - selected-process
    liveAccess:
      agent:
        enabled: true
        minimumMetricInterval: 1s
        signals:
          - lifecycle
          - own-process-tree
          - target-process-tree
          - target-syscall-file-network-metadata
          - resource-metrics
          - android-health
          - collector-coverage
          - sealed-observation-bundles
      visual:
        screenshots: target-transitions-and-on-demand
        liveScreenMaxFps: 2
    agentRequests:
      profiles: [deep]
      namedCaptures: [worldLifecycle, strace, perfetto, packetPayload, mitmproxy, frida]
    buffers:
      liveSubscriberEvents: 4096
      segmentBytes: 64Mi
      packetRingBytes: 2Gi
    allowedOnDemand:
      worldLifecycle:
        maxDuration: 2m
        maxBytes: 512Mi
        signalFamilies: [target.lifecycle]
      strace:
        maxDuration: 2m
        maxBytes: 512Mi
        signalFamilies: [process, syscall]
      perfetto:
        maxDuration: 5m
        maxBytes: 1Gi
        signalFamilies: [process, performance]
      packetPayload:
        maxDuration: 5m
        maxBytes: 1Gi
        requireFlowFilter: true
        signalFamilies: [network-packet]
      mitmproxy:
        maxDuration: 10m
        maxBytes: 2Gi
        decryptedPayloads: restricted
        signalFamilies: [network-flow]
      frida:
        maxDuration: 10m
        hostManagedCollectorScripts: pinned
        agentInstalledInstrumentation: allowed-recorded-not-coverage-authority
        signalFamilies: [process, app-api]
    triggers:
      - name: target-memory-pressure-evidence
        when:
          metric: target.memory.psi.full
          above: 0.10
          for: 5s
        actions:
          - raise-metric-resolution
          - capture-target-process-tree
      - name: android-crash-evidence
        when:
          event: android.native_crash
        actions:
          - seal-logcat-window
          - seal-perfetto-ring
          - capture-tombstone-if-permitted
          - capture-screenshot
          - finalize-packet-ring
    bundles:
      rawCollectorOutputs: true
      normalizedEvents: true
      targetChangeManifest: true
      collectorCoverageAndGaps: true
      derivedAgentSummary: true
      summaryMustCiteEvidence: true
    sensitivity:
      default: internal
      decryptedTraffic: restricted
      screenshots: restricted
      payloads: restricted
    retention:
      liveLocal: 24h
      finalizeToArtifactStore: true
      deleteLocalAfterArtifactAck: true

  incidents:
    minimumEvidence:
      - lifecycle-window
      - resource-window
      - process-tree
      - target-change-manifest
      - collector-coverage-and-gaps
    recovery:
      agentWorkspaceFailure: recreate-new-agent-generation
      linuxTargetFailure: recreate-new-target-generation
      androidRuntimeFailure: baseline-new-target-generation
      targetWorkloadExit: finalize-run-and-report
      androidAppCrash: finalize-run-and-report
      observerFailure: fail-run-if-required

  pressure:
    reserveHostMemory: 8Gi
    stopAdmissionOn:
      memoryPSIFull: 0.05
      ioPSIFull: 0.10
      freeDiskPercent: 15
    shedOrder:
      - unused-reservations
      - unleased-warm-targets
      - idle-preemptible-targets
      - active-preemptible-target-runs
      - preemptible-agent-workspaces
